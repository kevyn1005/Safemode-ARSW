services:
  blackbox:
    image: prom/blackbox-exporter:latest

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [ blackbox ]

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./observability/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./observability/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [ prometheus ]
