# Observabilidad del gateway cuando corre EN EL COMPUTADOR (sin Docker): Prometheus lee host.docker.internal:9464.
# Si el gateway corre en Docker, use docker-compose.persistencia.yml: trae el mismo Prometheus y Grafana, con el job del gateway,
# la sonda /ready y los servicios de persistencia. NO levante los dos archivos a la vez: ambos publican el 9090 y el 3000.
services:
  blackbox:
    image: prom/blackbox-exporter:latest

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [blackbox]

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./observability/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
