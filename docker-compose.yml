version: "3.9"

services:
  camera-feed-service:
    build: ./camera-feed-service
    ports:
      - "8081:8080"

  vision-detection-service:
    build: ./vision-detection-service
    ports:
      - "8082:8080"

  object-presence-tracker:
    build: ./object-presence-tracker
    ports:
      - "8083:8080"

  alert-engine:
    build: ./alert-engine
    ports:
      - "8084:8080"

  realtime-gateway:
    build: ./realtime-gateway
    ports:
      - "8085:8080"

  security-dashboard:
    build: ./security-dashboard
    ports:
      - "3000:3000"
