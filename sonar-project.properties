# Analisis de calidad de Safemode (SonarQube Cloud o un SonarQube propio). Lo usan .github/workflows/reusable-sonar.yml y la prueba local
# (docs/mantenibilidad/). Java y JavaScript en un solo proyecto; la cobertura sale de las pruebas ejecutadas en el pipeline:
# JaCoCo (backend, jacoco.xml por modulo) y c8 (frontend, lcov).
sonar.sourceEncoding=UTF-8

# ---- Codigo fuente ---------------------------------------------------------------------------------------------------------------------
sonar.sources=camera-feed-service/src/main,vision-detection-service/src/main,object-presence-tracker/src/main,alert-engine/src/main,realtime-gateway/src/main,service-common/src/main,access-service/src/main,collaboration-service/src/main,security-dashboard
sonar.tests=camera-feed-service/src/test,vision-detection-service/src/test,object-presence-tracker/src/test,alert-engine/src/test,realtime-gateway/src/test,service-common/src/test,access-service/src/test,collaboration-service/src/test,security-dashboard/test
sonar.exclusions=security-dashboard/node_modules/**,security-dashboard/coverage/**,security-dashboard/test/**,security-dashboard/lens-frames/**,**/*.png,**/*.mp4,**/*.onnx,**/target/**

# ---- Java --------------------------------------------------------------------------------------------------------------------------------
sonar.java.source=17
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# ---- JavaScript (el panel) ---------------------------------------------------------------------------------------------------------------
sonar.javascript.lcov.reportPaths=security-dashboard/coverage/lcov.info

# ---- Que NO se mide en cobertura (y por que) -------------------------------------------------------------------------------------------
# Programas de arranque y herramientas manuales (necesitan camara, pantalla, claves o red; no son logica del producto). Es la misma lista que
# jacoco-maven-plugin excluye en el pom padre: la cobertura de Sonar y la de JaCoCo cuentan lo mismo.
sonar.coverage.exclusions=**/AlertEngineRunner.java,**/AlertLatencyBenchmark.java,**/DetectionBenchmark.java,**/GatewayRunner.java,**/AccessServiceMain.java,**/CollaborationMain.java,**/ObjectPresenceTrackerTest.java,**/FrameCapturerTest.java,**/ScreenCaptureTest.java,**/VisionDetectionTest.java,**/TelegramChatIds.java,**/TelegramTestMessage.java,**/NvidiaCropCheck.java,**/MousePositionFinder.java
