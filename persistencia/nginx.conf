server {
  listen 80;
  root /usr/share/nginx/html;

  location / { try_files $uri $uri/ /index.html; }

  # Se resuelve el nombre en CADA peticion (resolver de Docker, cache de 5 s): si un servicio se detiene y se vuelve a iniciar
  # (experimentos de Redis y de la autoridad) su IP puede cambiar, y un proxy con el nombre fijo al arrancar daria 502.
  location /api/ {
    resolver 127.0.0.11 valid=5s;
    set $collab collaboration-service:8110;
    proxy_pass http://$collab;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }

  # /access/permissions/... llega a Gestion como /permissions/...
  location /access/ {
    resolver 127.0.0.11 valid=5s;
    set $access access-service:8100;
    rewrite ^/access/(.*)$ /$1 break;
    proxy_pass http://$access;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }
}
