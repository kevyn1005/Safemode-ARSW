name: pipeline

on:
  push:
  workflow_dispatch:

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Compilar y empaquetar (sin tests)
        run: mvn -B -DskipTests package
      - name: Guardar los jar
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: "**/target/*.jar"
          if-no-files-found: warn

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Tests de Java
        run: mvn -B test
      - name: Resultados de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests del dashboard (JavaScript)
        working-directory: security-dashboard
        run: npm test --if-present

  quality:
    name: Quality
    needs: test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Análisis con SonarCloud
        if: env.SONAR_TOKEN != ''
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=TU_ORG_TU_REPO
          -Dsonar.organization=TU_ORG
          -Dsonar.host.url=https://sonarcloud.io
      - name: Sin token de SonarCloud
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN no está configurado, se omite el análisis de calidad."

  deploy:
    name: Deploy
    needs: quality
    runs-on: ubuntu-latest
    # Apagado hasta que exista el despliegue: se activa creando la variable de repositorio DEPLOY_ENABLED=true
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Despliegue (pendiente)
        run: |
          echo "Aquí irá el despliegue, por definir."