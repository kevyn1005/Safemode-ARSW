name: pipeline

on:
  push:
  workflow_dispatch:

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Compilar y empaquetar (sin tests)
        run: mvn -B -DskipTests package
      - name: Guardar los jar
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: "**/target/*.jar"
          if-no-files-found: warn

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Tests de Java
        run: mvn -B test
      - name: Resultados de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests del dashboard (JavaScript)
        working-directory: security-dashboard
        run: npm test --if-present

  quality:
    name: Quality
    needs: test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Análisis con SonarCloud
        if: env.SONAR_TOKEN != ''
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=TU_ORG_TU_REPO
          -Dsonar.organization=TU_ORG
          -Dsonar.host.url=https://sonarcloud.io
      - name: Sin token de SonarCloud
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN no está configurado, se omite el análisis de calidad."

  deploy:
    name: Deploy
    needs: quality
    runs-on: ubuntu-latest
    # Se activa creando la variable de repositorio DEPLOY_ENABLED=true; corre en develop y en main
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && vars.DEPLOY_ENABLED == 'true'
    concurrency: deploy-aws
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Preparar SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      - name: Actualizar y levantar en la EC2
        run: |
          ssh -i ~/.ssh/id_deploy ubuntu@"$EC2_HOST" "BRANCH=$BRANCH bash -s" <<'EOF'
          set -euo pipefail
          cd ~/SafeMode
          git fetch origin "$BRANCH"
          git checkout -f -B "$BRANCH" "origin/$BRANCH"
          docker compose -f docker-compose.yml -f docker-compose.persistencia.yml -f docker-compose.tracker.yml -f docker-compose.publico.yml up -d --build postgres mongo redis access-service collaboration-service console blackbox prometheus grafana realtime-gateway tracker caddy k6
          EOF
      - name: Verificar que el panel responde
        run: curl -fsS --retry 12 --retry-delay 10 --retry-all-errors -o /dev/null https://safemode-arsw.duckdns.org/